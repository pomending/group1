<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        
        <title>font</title>

        <style>xxxeeerrrrrsssss

            .a1{ font-size : 20px;}/*사이즈만 정하고 싶다면 꼭 -size를 붙혀서 적용해야한다*/
            .a2{ font-style: italic;} /*기울이기*/
            .a3{ font-weight: bold;} /*두껍게*/
            .a4{ font-family: "한컴나무L","궁서","굴림"sans-serif;}
            /*브라우저에서 지원을 해야만 사용가능 해서 차선책으로 오른쪽으로 옮겨가며 적용*/
            .a5{ font-variant:small-caps; }/*소문자 크기의 대문자*/
            /*폰트에 속성을 한번에 적용하려면 순서를 지켜야 한다
                두께,스타일, 스몰캡,사이즈 ,글꼴순*/
            .a6{ font:bold normal small-caps 20px 
                "오이체","궁서", sans-serif; }/*font를 묶는 순서 반드시 지켜야함*/

                
                .a7{ font: 20px "오이체","궁서", sans-serif; }
                
                /*
                두께(bold)속성을 적용하려면 글꼴까지 함께 명시되어야 한다
                .a7{ font: bold 20px  "돋음"; ( o )} 
                .a7{ font: bold 20px  ( x ) 
                */   
        </style>

    </head>

    <body>
        
        <p class="a1">글자크기</p>
        <p class="a2">글자 스타일</p>
        <p class="a3">글자 두께</p>
        <p class="a4">글꼴</p>
        <p class="a5">The end</p>

        <p class="a6">단축 키워드</p>
        <p class="a7">단축 키워드</p>
        

    </body>
</html>
